name: FlashLearn AI - Production Deployment to Google Cloud Run

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI when secrets are set up
  push:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GCP_REGION || 'europe-west1' }}
  SERVICE_BACKEND: flashlearn-api
  SERVICE_FRONTEND: flashlearn-web

jobs:
  # ===========================================================================
  # Stage 1: Quality & Automated Test Gate
  # ===========================================================================
  quality-gate:
    name: 🧪 Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        working-directory: ./backend
        run: |
          ruff check app/ tests/

      - name: Run Pytest Test Suite
        working-directory: ./backend
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v --asyncio-mode=auto

  # ===========================================================================
  # Stage 2: Deploy Backend API to Google Cloud Run
  # ===========================================================================
  deploy-backend:
    name: ⚡ Deploy Backend API
    runs-on: ubuntu-latest
    needs: [ quality-gate ]
    outputs:
      backend_url: ${{ steps.get-backend-url.outputs.url }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: 📦 Build & Push Backend Container
        working-directory: ./backend
        run: |
          BACKEND_IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flashlearn-repo/${{ env.SERVICE_BACKEND }}:${{ github.sha }}"
          docker build -t "$BACKEND_IMAGE" -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flashlearn-repo/${{ env.SERVICE_BACKEND }}:latest" .
          docker push "$BACKEND_IMAGE"
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flashlearn-repo/${{ env.SERVICE_BACKEND }}:latest"

      - name: 🚀 Deploy Backend to Cloud Run
        run: |
          BACKEND_IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flashlearn-repo/${{ env.SERVICE_BACKEND }}:${{ github.sha }}"

          CLOUDSQL_FLAG=""
          if [ -n "${{ secrets.CLOUDSQL_INSTANCE }}" ]; then
            CLOUDSQL_FLAG="--add-cloudsql-instances=${{ secrets.CLOUDSQL_INSTANCE }}"
          fi

          gcloud run deploy ${{ env.SERVICE_BACKEND }} \
            --image "$BACKEND_IMAGE" \
            --region ${{ env.GAR_LOCATION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            $CLOUDSQL_FLAG \
            --set-env-vars ENVIRONMENT=production,ALGORITHM=HS256 \
            --set-secrets SECRET_KEY=FLASHLEARN_SECRET_KEY:latest,DATABASE_URL=FLASHLEARN_DATABASE_URL:latest,GEMINI_API_KEY=FLASHLEARN_GEMINI_KEY:latest,RESEND_API_KEY=FLASHLEARN_RESEND_API_KEY:latest

      - name: Capture Live Backend URL
        id: get-backend-url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_BACKEND }} --platform managed --region ${{ env.GAR_LOCATION }} --format 'value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Stage 3: Deploy Frontend Web Application to Google Cloud Run
  # ===========================================================================
  deploy-frontend:
    name: 🌐 Deploy Frontend Web
    runs-on: ubuntu-latest
    needs: [ deploy-backend ]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: 📦 Build & Push Frontend Container
        working-directory: ./frontend
        env:
          BACKEND_URL: ${{ needs.deploy-backend.outputs.backend_url }}
        run: |
          FRONTEND_IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flashlearn-repo/${{ env.SERVICE_FRONTEND }}:${{ github.sha }}"
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${BACKEND_URL}/api/v1" \
            -t "$FRONTEND_IMAGE" \
            -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flashlearn-repo/${{ env.SERVICE_FRONTEND }}:latest" .
          docker push "$FRONTEND_IMAGE"
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flashlearn-repo/${{ env.SERVICE_FRONTEND }}:latest"

      - name: 🚀 Deploy Frontend to Cloud Run
        id: deploy-web
        env:
          BACKEND_URL: ${{ needs.deploy-backend.outputs.backend_url }}
        run: |
          FRONTEND_IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flashlearn-repo/${{ env.SERVICE_FRONTEND }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_FRONTEND }} \
            --image "$FRONTEND_IMAGE" \
            --region ${{ env.GAR_LOCATION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --set-env-vars NODE_ENV=production,NEXT_PUBLIC_API_URL="${BACKEND_URL}/api/v1"

          FRONTEND_URL=$(gcloud run services describe ${{ env.SERVICE_FRONTEND }} --platform managed --region ${{ env.GAR_LOCATION }} --format 'value(status.url)')
          echo "frontend_url=$FRONTEND_URL" >> $GITHUB_OUTPUT

          # Sync the production frontend URL to the backend so password reset emails contain the live link
          gcloud run services update ${{ env.SERVICE_BACKEND }} \
            --region ${{ env.GAR_LOCATION }} \
            --platform managed \
            --update-env-vars FRONTEND_URL="$FRONTEND_URL"

      - name: 📊 Generate Production Deployment Dashboard
        if: always()
        env:
          BACKEND_URL: ${{ needs.deploy-backend.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.deploy-web.outputs.frontend_url }}
        run: |
          echo "## ⚡ FlashLearn AI — Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Cloud Run Service | Region | Production Endpoint | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ **Backend API** | \`${{ env.SERVICE_BACKEND }}\` | \`${{ env.GAR_LOCATION }}\` | [${BACKEND_URL}](${BACKEND_URL}) | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 **Frontend Web** | \`${{ env.SERVICE_FRONTEND }}\` | \`${{ env.GAR_LOCATION }}\` | [${FRONTEND_URL}](${FRONTEND_URL}) | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 🔒 **Security Notice**: Interactive Swagger docs (\`/docs\`) are strictly disabled in production mode." >> $GITHUB_STEP_SUMMARY
