name: FlashLearn AI - Production Deployment to Google Cloud Run

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI when secrets are set up
  push:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GCP_REGION || 'europe-west1' }}
  SERVICE_BACKEND: flashlearn-api
  SERVICE_FRONTEND: flashlearn-web

jobs:
  deploy:
    name: Build Containers & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: []  # Can depend on CI jobs passing

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # -----------------------------------------------------------------------
      # 1. Backend Build & Cloud Run Deploy
      # -----------------------------------------------------------------------
      - name: Build & Push Backend Container Image
        working-directory: ./backend
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flashlearn-repo/${{ env.SERVICE_BACKEND }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flashlearn-repo/${{ env.SERVICE_BACKEND }}:latest" .
          docker push "$IMAGE_TAG"
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flashlearn-repo/${{ env.SERVICE_BACKEND }}:latest"

      - name: Deploy Backend to Google Cloud Run
        id: deploy-backend
        run: |
          # Build optional Cloud SQL instance flag if provided via secret
          CLOUDSQL_FLAG=""
          if [ -n "${{ secrets.CLOUDSQL_INSTANCE }}" ]; then
            CLOUDSQL_FLAG="--add-cloudsql-instances=${{ secrets.CLOUDSQL_INSTANCE }}"
          fi

          gcloud run deploy ${{ env.SERVICE_BACKEND }} \
            --image "$IMAGE_TAG" \
            --region ${{ env.GAR_LOCATION }} \
            --platform managed \
            --allow-unauthenticated \
            $CLOUDSQL_FLAG \
            --set-env-vars ENVIRONMENT=production,ALGORITHM=HS256 \
            --set-secrets SECRET_KEY=FLASHLEARN_SECRET_KEY:latest,DATABASE_URL=FLASHLEARN_DATABASE_URL:latest,GEMINI_API_KEY=FLASHLEARN_GEMINI_KEY:latest


          # Retrieve deployed Backend URL
          BACKEND_URL=$(gcloud run services describe ${{ env.SERVICE_BACKEND }} --platform managed --region ${{ env.GAR_LOCATION }} --format 'value(status.url)')
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # 2. Frontend Build & Cloud Run Deploy
      # -----------------------------------------------------------------------
      - name: Build & Push Frontend Container Image
        working-directory: ./frontend
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flashlearn-repo/${{ env.SERVICE_FRONTEND }}:${{ github.sha }}"
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ env.BACKEND_URL }}/api/v1" \
            -t "$IMAGE_TAG" \
            -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flashlearn-repo/${{ env.SERVICE_FRONTEND }}:latest" .
          docker push "$IMAGE_TAG"
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flashlearn-repo/${{ env.SERVICE_FRONTEND }}:latest"

      - name: Deploy Frontend to Google Cloud Run
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flashlearn-repo/${{ env.SERVICE_FRONTEND }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_FRONTEND }} \
            --image "$IMAGE_TAG" \
            --region ${{ env.GAR_LOCATION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --set-env-vars NODE_ENV=production,NEXT_PUBLIC_API_URL="${{ env.BACKEND_URL }}/api/v1"

